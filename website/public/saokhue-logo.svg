      <stop offset="0%" stop-color="#00C454" />
      <stop offset="100%" stop-color="#00722F" />
    </linearGradient>
    <filter id="sk-flower-shadow" x="-12%" y="-12%" width="124%" height="128%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#01381B" flood-opacity="0.28" />
    </filter>
  </defs>
  <!-- Rounded Squircle Background (VPBank Prosperity Green Gradient) -->
  <rect x="28" y="28" width="456" height="456" rx="118" fill="url(#sk-bg)" />
  <rect x="31" y="31" width="450" height="450" rx="115" fill="none" stroke="#FFFFFF" stroke-opacity="0.24" stroke-width="3" />
