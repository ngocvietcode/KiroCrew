    <!-- Left Outer-Lower Petal -->
    <path d="M 3.5 84 C -0.5 84 -1 88.5 1.8 92 L 112 219.5 C 118 225.5 125 228 132.5 228 L 132.5 163.5 L 79.5 101.5 C 67 87.5 52 84 32 84 Z" />
    <!-- Right Outer-Lower Petal -->
